name: Run Automated Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    # 1. Pull down the repository code onto the runner
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Start the Docker containers exactly like you do locally
    - name: Start Docker Containers
      env:
        SECRET_KEY: ${{ secrets.SECRET_KEY }}
        POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      run: |
        echo "SECRET_KEY=${SECRET_KEY}" > .env
        echo "DEBUG=True" >> .env
        echo "POSTGRES_DB=ecommerce_scraper_db" >> .env
        echo "POSTGRES_USER=postgres" >> .env
        echo "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}" >> .env
        echo "DATABASE_HOST=db" >> .env
        echo "DATABASE_PORT=5432" >> .env
        docker compose up -d db web

    # 3. Wait a few seconds for the database to accept connections
    - name: Sleep for DB readiness
      run: sleep 15

    # 4. Run the exact test command inside the web container
    - name: Run Pytest Suite
      run: |
        docker compose exec -T web pytest -v